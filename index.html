<!DOCTYPE html>
<html lang="en" data-ui="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>The Dressing Game</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>👗</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <h1>The Dressing Game</h1>
      <div class="tools">
        <button id="btn-rainbow" class="tool" title="Give everything a new colour" aria-label="Rainbow">
          <span class="ico">🌈</span><span class="label">Rainbow</span></button>
        <button id="btn-surprise" class="tool" title="Dress everyone at random" aria-label="Surprise">
          <span class="ico">🎲</span><span class="label">Surprise!</span></button>
        <button id="btn-clear" class="tool" title="Undress the chosen figure / empty the room" aria-label="Clear">
          <span class="ico">🧺</span><span class="label">Clear</span></button>
        <button id="btn-save" class="tool" title="Save the picture" aria-label="Save picture">
          <span class="ico">💾</span><span class="label">Save</span></button>
        <button id="btn-theme" class="tool" title="Light or dark app theme" aria-label="Switch app theme">
          <span class="ico">🌙</span><span class="label">Dark</span></button>
      </div>
    </header>

    <main class="layout">
      <section class="stage">
        <svg
          id="scene"
          viewBox="0 0 960 560"
          preserveAspectRatio="xMidYMid meet"
          role="img"
          aria-label="A lady and a gentleman standing in a decorated room"
        ></svg>
      </section>

      <aside class="panel">
        <nav id="tabs" class="tabs"></nav>
        <p id="hint" class="hint"></p>
        <div id="tray" class="tray"></div>
      </aside>
    </main>

    <p id="toast" class="toast" role="status" hidden></p>

    <div id="shot" class="shot" hidden role="dialog" aria-modal="true" aria-label="Your picture">
      <div class="shot-box">
        <p class="shot-tip" id="shot-tip">Press and hold the picture, then choose <b>Save to Photos</b>.</p>
        <img id="shot-img" alt="The lady and the gentleman in their room" />
        <button id="shot-close" class="tool">Close</button>
      </div>
    </div>

    <script type="module" src="js/game.js"></script>
    <script>
      if (location.protocol === 'file:') {
        document.querySelector('.stage').innerHTML =
          '<p style="max-width:34ch;font-size:16px;line-height:1.5">This game uses ES modules, so it needs to be served over http.' +
          '<br><br>Run <code>python3 -m http.server 8777</code> in this folder and open ' +
          '<code>http://127.0.0.1:8777/</code></p>';
      }
    </script>
  </body>
</html>
