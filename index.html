<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>The Dressing Game</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>👗</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <h1>The Dressing Game</h1>
      <div class="tools">
        <button id="btn-colour" class="tool" aria-pressed="false" title="Colour the clothes">🎨 Colour</button>
        <button id="btn-surprise" class="tool" title="Dress everyone at random">🎲 Surprise!</button>
        <button id="btn-clear" class="tool" title="Undress the chosen figure / empty the room">🧺 Clear</button>
        <button id="btn-save" class="tool" title="Save the picture">💾 Save</button>
      </div>
    </header>

    <main class="layout">
      <section class="stage">
        <svg
          id="scene"
          viewBox="0 0 960 560"
          preserveAspectRatio="xMidYMid meet"
          role="img"
          aria-label="A lady and a gentleman standing in a decorated room"
        ></svg>
      </section>

      <aside class="panel">
        <nav id="tabs" class="tabs"></nav>
        <p id="hint" class="hint"></p>
        <div id="tray" class="tray"></div>
      </aside>
    </main>

    <script type="module" src="js/game.js"></script>
    <script>
      if (location.protocol === 'file:') {
        document.querySelector('.stage').innerHTML =
          '<p style="max-width:34ch;font-size:16px;line-height:1.5">This game uses ES modules, so it needs to be served over http.' +
          '<br><br>Run <code>python3 -m http.server 8777</code> in this folder and open ' +
          '<code>http://127.0.0.1:8777/</code></p>';
      }
    </script>
  </body>
</html>
